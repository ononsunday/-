<!doctype html>
<html lang="zh-CN">
  <head>

    <link rel="stylesheet" href="tonight-viewport.css" />
    <link rel="preload" href="assets/scenes/today-background.webp" as="image" />

  </head>
  <body>

      aria-hidden="true"

      <defs>
        <symbol id="hiyori-flower" viewBox="0 0 100 100">
          <g fill="none" stroke="currentColor" stroke-width="1.3">
            <ellipse cx="50" cy="29" rx="12" ry="22" />

              cx="50"
              cy="29"
              rx="12"
              ry="22"
              transform="rotate(72 50 50)"
            />
            <ellipse
              cx="50"
              cy="29"
              rx="12"
              ry="22"
              transform="rotate(144 50 50)"
            />
            <ellipse
              cx="50"
              cy="29"
              rx="12"
              ry="22"
              transform="rotate(216 50 50)"
            />
            <ellipse
              cx="50"
              cy="29"
              rx="12"
              ry="22"
              transform="rotate(288 50 50)"

    <a class="skip-link" href="#main">跳到今日记录</a>
    <div class="app-shell">
      <header class="brand-bar">
        <a href="#" class="brand" aria-label="日和，回到今天"

            <use href="#hiyori-flower" />

          <span>日和<small>HIYORI · A LITTLE EVERY DAY</small></span></a
        ><span class="save-status" role="status">此刻，安心记录</span>

      <main id="main" tabindex="-1" aria-label="日和记录"></main>
      <footer class="page-footer">
        平凡的一天，也值得被记住。<span>HIYORI · YOUR LITTLE DAYS</span>
      </footer>
    </div>
    <nav class="bottom-nav" aria-label="主导航"></nav>
    <div class="toast" role="status" hidden></div>
    <dialog id="confirm-dialog"></dialog>
    <script type="module" src="app.js"></script>
    <script type="module" src="ui-effects.js"></script>
  </body>
</html>
